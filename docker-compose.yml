version: '3.8'

services:
  media-utils:
    image: jain9rajat/media-utils:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: media-utils
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      # Optional: Mount directories for persistent uploads/outputs
      - media-uploads:/tmp/media_utils_uploads
      - media-outputs:/tmp/media_utils_outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 3G
        reservations:
          cpus: '2.0'
          memory: 1G

volumes:
  media-uploads:
  media-outputs:
